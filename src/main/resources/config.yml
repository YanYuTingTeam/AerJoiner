update_delay: 60
timeout: 500
bungee_config_path: "../config.yml"
teleport_check_interval: 1
teleport_max_retries: 3
teleport_max_servers: 3
start:
  title: "§a匹配成功|§e开始加入...|10|30|10"
success:
  title: "§a匹配成功|§e开始加入...|10|30|10"
failed:
  no_room:
    title: "§4匹配失败|§e没有可用房间|10|30|10"
  too_fast:
    title: "§4匹配失败|§e请勿点击过快|10|30|10"
  no_group:
    title: "§4匹配失败|§e剩余可用房间为0|10|30|10"
max_request: 1

# Redis 配置（游戏服通过 Redis 发布房间信息）
redis:
  enabled: true
  host: 127.0.0.1
  port: 6379
  password: ""
  max-connections: 10
  pool-config:
    max-idle: 5
    min-idle: 1
  ip-map:
    "192.168.2.91": "localhost"
